<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GTM MOVIES </title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',Arial}
body{background:#000;color:#fff;overflow-x:hidden}
header{position:fixed;top:0;width:100%;z-index:10;background:linear-gradient(180deg,rgba(0,0,0,.9),transparent);padding:15px 4%;display:flex;justify-content:space-between;align-items:center}
.logo{color:#e50914;font-size:28px;font-weight:900;letter-spacing:1px}
.search input{background:#222;border:1px solid #444;color:#fff;padding:8px 15px;border-radius:20px;width:200px}
.hero{position:relative;height:85vh;min-height:500px;display:flex;align-items:flex-end;padding:5% 4%;background:#111}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:brightness(.5)}
.hero-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#000 0%,transparent 60%)}
.hero-content{position:relative;z-index:2;max-width:600px}
.hero-content h1{font-size:52px;font-weight:900;line-height:1.1;margin-bottom:15px;text-shadow:2px 2px 10px #000}
.hero-content p{color:#ddd;line-height:1.6;margin-bottom:20px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.btn-play{background:#fff;color:#000;padding:12px 30px;border-radius:6px;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;gap:8px;margin-left:10px}
.btn-info{background:rgba(109,109,110,.7);color:#fff;padding:12px 30px;border-radius:6px;font-weight:700;text-decoration:none}
.row{padding:20px 4%}
.row h2{font-size:20px;margin-bottom:12px}
.slider{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
.slider::-webkit-scrollbar{display:none}
.card{min-width:170px;width:170px;background:#1a1a1a;border-radius:8px;overflow:hidden;transition:.3s;cursor:pointer;flex-shrink:0}
.card:hover{transform:scale(1.08);z-index:3}
.card img{width:100%;height:250px;object-fit:cover;display:block}
.card.info{padding:8px;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:3}
.dot{width:30px;height:4px;background:rgba(255,255,255,.4);border-radius:2px;cursor:pointer}
.dot.active{background:#fff}
</style>
</head><body>
<header><div class="logo">GTM MOVIES</div><div class="search"><input id="search" placeholder="بحث..." oninput="filter()"></div></header>

<div class="hero" id="hero"><div class="hero-bg" id="heroBg"></div><div class="hero-content" id="heroContent">جاري التحميل...</div><div class="dots" id="dots"></div></div>

<div id="rows"></div>

<script>
const supa=supabase.createClient('https://akkroydgqotbavvchiju.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFra3JveWRncW90YmF2dmNoaWp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MjY2MDcsImV4cCI6MjEwMjAwMjYwN30.lP10UuBAudqfOeoSpOkfHOXMR1Z24kY68CRNmKUcXpo');
let allMovies=[],heroMovies=[],heroIdx=0,heroTimer;

function fixPoster(u){return u||'https://via.placeholder.com/500x750?text=No+Image'}

async function load(){
 let {data}=await supa.from('movies').select('*').order('id',{ascending:false});
 allMovies=data||[];
 heroMovies=allMovies.slice(0,5);
 if(heroMovies.length) showHero(0), startHero();
 renderRows(allMovies);
}
function showHero(i){
 heroIdx=i; let m=heroMovies[i];
 document.getElementById('heroBg').style.backgroundImage=`url('${fixPoster(m.poster_url)}')`;
 document.getElementById('heroContent').innerHTML=`
  <h1>${m.title}</h1>
  <p>${m.description||'شاهد الان على GTM Movies بجودة عالية.'}</p>
  <a class="btn-play" href="movie.html?id=${m.id}">▶ تشغيل</a>
  <a class="btn-info" href="movie.html?id=${m.id}">ⓘ تفاصيل</a>
 `;
 document.getElementById('dots').innerHTML=heroMovies.map((_,k)=>`<div class="dot ${k==i?'active':''}" onclick="showHero(${k})"></div>`).join('');
}
function startHero(){ clearInterval(heroTimer); heroTimer=setInterval(()=>showHero((heroIdx+1)%heroMovies.length),4000); }

function renderRows(movies){
 let rowsHtml='';
 rowsHtml+=`<div class="row"><h2>🔥 أحدث الإضافات</h2><div class="slider">${movies.slice(0,10).map(card).join('')}</div></div>`;
 rowsHtml+=`<div class="row"><h2>🎬 كل الأفلام</h2><div class="slider" id="allRow">${movies.map(card).join('')}</div></div>`;
 document.getElementById('rows').innerHTML=rowsHtml;
}
function card(m){return `<div class="card" onclick="location.href='movie.html?id=${m.id}'"><img src="${fixPoster(m.poster_url)}" loading="lazy"><div class="info">${m.title}</div></div>`}
function filter(){
 let q=search.value.toLowerCase();
 let f=allMovies.filter(m=>m.title.toLowerCase().includes(q));
 document.getElementById('allRow').innerHTML=f.map(card).join('')||'مفيش نتائج';
}
load();
</script>
</body></html>
