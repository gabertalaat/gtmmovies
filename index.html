<!DOCTYPE html><html dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>GTM MOVIES</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{background:#111;color:white;font-family:Arial;padding:20px} .movie{display:inline-block;width:160px;margin:10px;background:#222;border-radius:10px;overflow:hidden;vertical-align:top} img{width:100%;height:230px;object-fit:cover} .info{padding:8px} a{color:white;text-decoration:none}</style>
</head><body>
<h1>GTM MOVIES 🎬</h1>
<div id="movies">جاري التحميل...</div>
<script>
const supa = supabase.createClient('https://akkroydgqotbavvchiju.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFra3JveWRncW90YmF2dmNoaWp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MjY2MDcsImV4cCI6MjEwMjAwMjYwN30.lP10UuBAudqfOeoSpOkfHOXMR1Z24kY68CRNmKUcXpo');

function fixPoster(url){
  if(!url) return 'https://via.placeholder.com/160x230?text=No+Image';
  url=url.trim();
  if(url.includes('drive.google.com')){
    let m=url.match(/\/d\/([^\/]+)/) || url.match(/id=([^&]+)/);
    if(m) return `https://drive.google.com/uc?export=view&id=${m[1]}`;
  }
  return url;
}
function fixVideo(url){
  if(!url) return '#';
  url=url.trim();
  if(url.includes('/shorts/')){
    let id=url.split('/shorts/')[1].split(/[?&]/)[0];
    return `https://www.youtube.com/watch?v=${id}`;
  }
  return url;
}

async function load(){
 let {data, error}=await supa.from('movies').select('*').order('id',{ascending:false});
 if(error){ document.getElementById('movies').innerHTML='خطأ: '+error.message; return; }
 document.getElementById('movies').innerHTML = data.map(m=>`
  <div class="movie"><a href="${fixVideo(m.video_url||m.watch_url)}" target="_blank"><img src="${fixPoster(m.poster_url)}" onerror="this.src='https://via.placeholder.com/160x230?text=No+Image'"><div class="info"><b>${m.title}</b><br><small>${m.year||''}</small></div></a></div>
 `).join('') || 'لسه مفيش افلام';
}
load();
</script>
</body></html>
